name: Release to crates.io

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: publish-ls2
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: Verify the release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ls2
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Match the release tag to Cargo.toml
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "ls2") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match the ls2 package version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
      - name: Check for a first-release token
        id: bootstrap
        env:
          HAS_PUBLISH_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: printf 'enabled=%s\n' "$HAS_PUBLISH_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io Trusted Publishing
        if: steps.bootstrap.outputs.enabled != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --all-features --package ls2
