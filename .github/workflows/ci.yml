name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test --locked
      - name: Test all features
        run: cargo test --locked --all-features
      - name: Test the minimum Rust version
        run: cargo +1.85.0 test --locked --all-features
      - name: Build API documentation
        run: cargo doc --locked --no-deps --all-features
      - name: Verify the crate package
        run: cargo package --locked --all-features

  webos:
    name: Cross-build for webOS ARMv7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust ARMv7 target
        run: rustup toolchain install stable --profile minimal --target armv7-unknown-linux-gnueabi
      - name: Install the buildroot-nc4 SDK
        env:
          SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
          SDK_SHA256: 2230a6351e5cce6fcb9d4fdcb4697335f223995401ef969c81744aaeb14c5344
        run: |
          archive="$RUNNER_TEMP/webos-sdk.tar.gz"
          sdk="$RUNNER_TEMP/webos-sdk"
          curl --fail --silent --show-error --location --retry 3 "$SDK_URL" --output "$archive"
          printf '%s  %s\n' "$SDK_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$sdk"
          tar -xzf "$archive" --strip-components=1 -C "$sdk"
          "$sdk/relocate-sdk.sh"
          printf 'WEBOS_SDK=%s\n' "$sdk" >> "$GITHUB_ENV"
      - name: Build and check the webOS executables
        run: tools/build-tv.sh --locked --all-features
